  notes: "Read by code from the Parcoursup fiche (French level, distance learning) and from Campus France national pages (duration, fees for a non-EU student at a public institution, certificate, platform). The national facts are not this programme's own page. | DurationEvidence mixes a general 'licence contrôlée par l'Etat' statement with a secondary source ('Licence (3 ans)'); neither is a clean programme-page quote for the 3 years, so a human may wish to confirm. Tuition: the programme's own Parcoursup page gives 175 euros/year, but that is the national rate for French/EU/EEA/Swiss residents and does not apply to a non-EU Moroccan applicant. The 2 902 € differentiated rate is from etudiant.gouv.fr and is the standard first-cycle differentiated rate, but it is not stated on the programme page itself. No intake dates (admission calendar) were stated for this programme in the supplied pages. Application channel intentionally omitted: foreign-diploma applicants use Études en France / Campus France, not Parcoursup."
