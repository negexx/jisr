  notes: "Tuition left out: Milano-Bicocca uses an income-based (ISEE) system. The Contribution for International Students gives a fixed tuition fee per country group and course area, but no accepted quote ties Morocco to a country group (no Morocco/Marocco list found for 2026/27), and no accepted quote states one lowest and one highest fee for this student. Page apply.unimib.it/en_GB/contents/content/10-fees-and-funding merely refers to an external Country list and Course Areas, without figures. Application channel: the programme's own call for non-EU students residing abroad directs applicants to the university's apply.unimib.it platform (first round). Deadlines 18 Feb 2026 – 31 Mar 2026 are for non-EU candidates residing abroad (2026/27); later rounds exist for other categories. Note the separate deadline: TOLC test by 27 March 2026, results uploaded by 31 March 2026.; Milano-Bicocca Contribution Guide 2026/27, section 2 (international students: non-Italian citizen, foreign qualification, foreign residence): the 2nd and 3rd instalments are the balance of the Regional Tax plus a FIXED University Tuition Fee set by country group (Appendix 4) and course area A/B (Appendix 1). Morocco is in Group 1 (Appendix 4 heading 'Group 1', the Group 2 heading comes only after the list). Group 1 fixed tuition: Area A EUR 200 (one instalment, the 2nd), Area B EUR 300. The amount quote does not name this programme's area, so by the two-quote rule the range 200-300 is given (area NOT tied in the quotes). For the audit: Appendix 1 of the same guide lists 'Economics and science for environmental sustainability' under Area A, so the applicable figure is EUR 200. Not included: EUR 146 first instalment (stamp duty plus regional tax advance), EUR 150 deposit, and the Regional Tax balance (0, 30 or 60 by ISEE). Group 1 has no 3rd instalment. Year: Contribution Guide 2026/27 (title and deadlines 2026-2027)."
