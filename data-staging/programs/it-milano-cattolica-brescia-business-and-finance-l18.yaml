  notes: "applicationChannel: kept the existing official value; the reader found \"it-universitaly\" at https://international.unicatt.it/ucscinternational-9848.htm; These pages describe Università Cattolica's international application process; the programme's own pages (Overview and Admission and tuition) state that applications for AY 2026/2027 are closed and the next application period opens in Fall 2026 for AY 2027/2028, but no dated application window for non-EU applicants residing abroad is given, so no intake could be quoted. Tuition was left out: the only fee figures found on the supplied pages are for the 3-year Bachelor's Degree in International Relations and Global Affairs (a different programme) and are based on where family income is produced, with no Morocco country-group quote and no tie to Business and Finance. The application procedure page with a dated non-EU deadline (27 May 2025) is for the 2-year Graduate degree in Innovations in Biotechnology Applied to Regenerative Medicine, not for this Bachelor's programme. The Cattolica Admission Test page concerns the Bachelor of Economics and Management, so its test, fee (EUR 60) and score thresholds are not stated for this programme. No document list specific to this programme was found; the enrolment document list page refers to 2019 and is for the enrolment stage of unspecified undergraduate programmes.; Cattolica flat tuition for non-EU families, EUR 8,800 per year: the rate depends on where the family income is produced (not citizenship), so a Moroccan citizen with family income in Morocco pays the non-EU flat rate; one flat rate for all 3-year BSc degrees (brochure table row '3-year BSc degrees', NON-EU residents). Source year: Undergraduate brochure for AY 2026/27 (intakes Sept 2026) and the tuition page that lists the 2026/27 payment deadlines; the amount sentence itself carries no year label, and the page says fees are published each spring for the next academic year and may rise slightly by inflation after the first year. The UCSC International Scholarship (applied for during the application, awarded with the admission offer) would lower it to about EUR 5,900; not used as the tuition. The tuition page shown is under the International Relations programme path but is the shared 'Tuition fees and scholarships' tab (text refers to all Bachelor's)."
