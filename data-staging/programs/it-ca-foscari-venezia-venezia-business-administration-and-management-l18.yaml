  evidence:
    - fact: documents
      url: https://www.unive.it/pag/40976/
      quote: "Bachelor’s degree requirements Applicants enrolling into bachelor’s degree programmes must have uploaded all the following documents in the relevant “Task” sections of their profile on apply.unive.it: Italian visa for study; Higher Secondary School final Diploma and transcript of records (both in the original language and officially translated into Italian or English language if needed); Statement of Comparability issued by CIMEA OR Declaration of Value issued by the Italian representatives abroad OR ARDI Statement of Correspondance along with the CIMEA Statement of Verification"
  notes: "Tuition: 1300 EUR flat fee assumed for a non-EU citizen whose household is outside Italy; the quoted page is for a.y. 2025/2026 and lists three non-EU categories. No quote ties Morocco to the reduced/developing-country list, so the 700 EUR reduced fee was not used; the Morocco tie was looked for in the national list (DM 166 of 3 March 2025) and not found. Application deadlines: the pages give no dated application round for 2026/27 for non-EU applicants requiring a visa (the only general opening date, 17 December 2025, is not tied to this applicant group), so no intake was recorded; the 30 September 2026 date is a pre-enrolment/visa deadline on the Universitaly portal, and enrolment closes 18 December 2026."
