  notes: "Tuition: no figure extracted. The programme page and the international pages state that fees depend on the ISEE/ISEE parificato (income-based system), but no quote states both a lowest and a highest fee applying to this non-EU student with household abroad for a.y. 2026/27; the ISEE band table has many rows and the country list naming Morocco is tied to admission calls (4th Call), not to a country group fee. Intakes: application deadlines/routes are the pre-evaluation call periods (1st Call 16 December 2025 – 30 January 2026, 2nd Call 1°March 2026 – 30 April 2026, 3rd Call 8 - 30 June 2026, 4th Call 1° - 31 July 2026 for students from Morocco among others); these are pre-evaluation application windows on the UNIVPM portal, and further rounds exist. The visa deadline of 30 November 2026 is a visa deadline, not an application deadline."
