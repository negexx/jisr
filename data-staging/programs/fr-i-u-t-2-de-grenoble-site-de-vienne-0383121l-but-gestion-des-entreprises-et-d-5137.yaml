  notes: "Read by code from the Parcoursup fiche (French level, distance learning) and from Campus France national pages (duration, fees for a non-EU student at a public institution, certificate, platform). The national facts are not this programme's own page. | Durée (3 ans / Bac+3 / 6 semestres), langue d'enseignement (français) et niveau de français B2 proviennent de la fiche de formation UGA et de la fiche Parcoursup. Les 178 €/an figurent sur la fiche Parcoursup sous \"Frais de scolarité\" ; ce montant correspond aux droits d'inscription nationaux de licence et est présenté sur la fiche sans distinction de nationalité — un étudiant marocain non-EU peut être concerné par les droits différenciés (2 902 €/an en licence selon Campus France Maroc) ; un audit humain est recommandé. La candidature ne passe pas par Parcoursup pour ce profil (Bac marocain, non-EU) : voir la procédure Études en France / Campus France Maroc."
