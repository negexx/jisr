  notes: "Tuition left out: the only fee page found is the university-wide Regolamento contribuzione 2026/2027 (Tab. A + coeff. Tab. C). No quote ties this programme to one of the three degree-programme groups (US/TS/UE), and the Morocco coefficient appears only in Tab. C, which applies to the '9X' range, i.e. an income band, not a stated lowest/highest fee for this student; the second-instalment/ISEE table is a many-row band table, not a tuition. Application deadline refers to non-EU visa-needing applicants (18 March 2026 – 4 May 2026); the general admission calendar page gives a different end date (6 May 2026) for non-EU visa applicants, so more rounds/dates exist. Application channel: this programme says to apply through apply.unisi.it (the university's own portal); no quote names Universitaly pre-enrolment for this programme.; Siena 2026/27 contribution regulation, Art. 4: for students who cannot produce a valid Italian ISEE (no ISEE parificato allowed; this is the regime of foreign-income students) the all-inclusive annual contribution is the '9X' row of Tab. A multiplied by the Tab. C coefficient of the country of citizenship, with a floor of EUR 500. Tab. C lists Marocco with coefficient 0,1103 (a number below one), and every 9X value in Tab. A (2.250 to 2.952) times 0,1103 is far below 500, so the EUR 500 floor applies whatever the course type or group; I did not compute a product for the proposal, 500 is the stated floor. Regional tax (DSU) and stamp duty are added to the first instalment and are not included. Inference to audit: the regulation does not name 'foreign students' in comma 6 itself, it follows comma 5 (no ISEE parificato for those who cannot produce the Italian ISEE) and uses citizenship coefficients. The unisi simulator (https://parch.unisi.it/servizi2/simulatoretasse/?anno=2026) would confirm the figure. Programme is humanistic-social type, irrelevant here because of the floor."
