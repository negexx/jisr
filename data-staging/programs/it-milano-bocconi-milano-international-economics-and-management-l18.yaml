    - fact: tuition
      url: https://www.unibocconi.it/en/applying-bocconi/bachelor-and-law-programs/fees
      quote: For 2027-28 a.y., for students enrolled to their first year in a Bachelor of Science or Law programme, tuition and fees at Bocconi are set at € 17,700 per year.
  notes: "Le programme nommé dans la tâche (« International Economics and Management ») ne figure pas sous ce nom sur les pages fournies : la page produit de l'URL indiquée par la tâche affiche « <title>Management | Bocconi University</title> » et renvoie en réalité au BSc in Management (classe L-18, 180 CFU, enseigné en anglais, 3 ans). Tous les faits de ce JSON concernent donc ce programme de premier cycle de la classe L-18. Deux tours de candidature existent pour l'international (Early Session 2–29 septembre 2026 et Winter Session 25 novembre 2026 – 26 janvier 2027) ; seul le premier tour est saisi. Les dates d'ouverture/fermeture proviennent de la phrase « Early Session 2 - 29 September 2026 (3:00pm Italian time) » et de la phrase indiquant que les candidats internationaux peuvent réserver le test en ligne à partir du 13 juillet 2026. Pour les frais de scolarité : la page dit que pour 2027-28 les frais pour les étudiants de première année de Bachelor of Science ou Law sont fixés à 17 700 € par an, montant général non différencié par nationalité ; les pages fournies ne précisent pas de groupe tarifaire ni de dispense spéciale pour les étudiants non-UE résidant à l'étranger, donc ce montant est utilisé tel quel (avec la réserve qu'il s'agit d'un tarif annuel de référence). Aucune page ne mentionne Universitaly, la préinscription obligatoire pour les candidats résidant au Maroc, ni un formulaire de candidature propre à l'université pour ce programme ouvert aux candidats non-UE résidant à l'étranger ; je n'ai donc pas extrait la « applicationChannel ». Les documents requis listés proviennent de la page « Admissions » (ID/passport, documents des parents si mineur, relevés des deux dernières années, rapport de score du test). Aucun document n'exige une traduction d'après ces pages. »"
