  notes: "Torino 2026/27: students resident abroad pay a fixed single all-inclusive contribution (COU) by the PPP GDP per capita of the country of residence; Allegato A of the regulation DR 6194/2026 lists Morocco 8,957.01 -> 500 EUR (enrolments up to the 2nd year out of course; 550 from the 3rd). The 156 EUR first instalment (regional tax + stamp) is extra and not included. Morocco is not in the DM 176/2026 exempt (poorest countries) list per the registry notes, so the exemption does not apply (I did not re-read the decree). The regulation lists extra programme contributions only for Management dell'Informazione e della Comunicazione Aziendale, Business & Management and online degrees; none found for Economics and Finance with Data Science. The page and the regulation both say a.a. 2026-2027; 2027/28 not published."
