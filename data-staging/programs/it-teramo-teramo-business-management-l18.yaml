      quote: "GROUP B Middle-income countries: Albania, Algeria, Argentina, Armenia, Azerbaijan, Bielorussia, Belize, Bhutan, Bolivia, Bosnia ed Erzegovina, Botswana, Brasile, Camerun, Capo Verde, Cina, Colombia, Congo (Repubblica), Costa Rica, Costa d'Avorio, Cuba, Dominica, Repubblica Dominicana, Ecuador, Egitto, El Salvador, Guinea Equatoriale, Eswatini, Fiji, Gabon, Georgia, Ghana, Grenada, Guatemala, Honduras, India, Indonesia, Iran, Iraq, Giamaica, Giordania, Kazakistan, Kenya, Kirghizistan, Libano, Maldive, Isole Marshall, Micronesia, Mongolia, Montenegro, Marocco"
  notes: "Tuition: a country-group fee applies (non-EU student whose household is abroad). Morocco is named as belonging to GROUP B (Middle-income countries) in the same academic year as the amounts, but no quote ties this programme to a programme group, so the FALLBACK range from the lowest (Group A €50) to the highest (Group C €600) of the country-group figures that apply to this student is given: amountMinor 30000 (€300) to maxAmountMinor 60000 (€600) per year. The quotes shown are the amount quote (which shows all three group figures) and the Morocco tie quote. The regional tax (€140) and stamp duty (€16) are separate and not included. Application window: the Universitaly pre-enrolment is stated from April 2026 to November 30, 2026, but the closing date is the national visa deadline, not an application deadline, and the opening date lacks a day; both are left null. Enrolment for Bachelor's programmes open to all applicants runs from July 1st to November 5, 2026 (a general enrolment window, not the non-EU application window). No dated deadline specific to non-EU applicants with a stated day and month and year was found in the pages. The programme page states access mode free (open access).; Teramo comprehensive annual contribution (COA) for students whose family unit has income and assets only abroad (Table 6 of the Regolamento contribuzione studentesca a.a. 2026/2027, D.R. n. 275 of 26/06/2026), by World Bank group of the country of citizenship. Group B (middle-income): EUR 300 for course type A, EUR 350 for type B. The regulation does not tie L-18 Business Management to a type in the quote; the Italian 'Importi delle tasse a.a. 2026/2027' page (https://www.unite.it/UniTE/Tasse/Importi_delle_tasse) labels the second column 'COA corso di laurea magistrale in Medicina veterinaria' (type B), so the expected figure for this Bachelor is EUR 300; by the two-quote rule the range 300-350 is given (programme type NOT tied in the quotes). Morocco ('Marocco') is named in the Group B list on the English fee page https://www.unite.it/English/Studying_at_UniTe/Tuition_fees (it cites DM 176/2026; the regulation's Allegato 2 also has Morocco, but its three-column text layout is too interleaved to quote safely). Regional tax EUR 140 and stamp duty EUR 16 are added and not included (the regulation says so). If a valid ISEE-U is submitted, the fixed COA does not apply. The euro amounts in the HTML pages come out garbled (U+FFFD) in the pipeline text, which is why the regulation PDF is the amount source."
