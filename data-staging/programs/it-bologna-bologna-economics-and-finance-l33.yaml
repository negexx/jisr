  notes: "Tuition: no usable figure found. The programme page states that tuition fees are calculated according to the ISEE certificate with subsidies/exemptions, but no single amount (or lowest-and-highest pair in one quote) for a non-EU student with household abroad is given; the only concrete per-student figures are reduced fixed fees for particularly poor/developing or non-OECD country citizens, and the page's non-OECD list does not name Morocco, so those reduced fees are left out. Intakes: three rounds exist for 2026/27; the first (10 Feb 2026 - 4 May 2026) is used, with a second round from 5 May 2026 to 3 July 2026 and an extraordinary round from 3 September 2026 to 11 September 2026; the non-EU resident-abroad places (40) are in the first intake. There is also a separate matriculation window for non-EU students (upload documents by 21 July 2026 to obtain unconditional pre-enrolment validation without paying the first instalment). Doc translation: the page states qualification may need to be translated, legalised and authenticated ‘if required’, so translationRequired is set only for the qualification, as a conditional requirement.; Reduced fixed fee (flat tax) of the University of Bologna for citizens of non-OECD countries, a.y. 2026/27 (the page says 'fixed amounts for the a.y. 2026/27'): first-cycle freshman EUR 1,000 per year (EUR 1,200 without the minimum credits, not applicable to a freshman). Morocco (Marocco) is on the 'Elenco Paesi NON OCSE' 2026 list and is NOT on the particularly-poor list (that list was checked, EUR 500 tier does not apply). Requirements: citizenship of a listed country and family income/assets only outside Italy (declaration only). The separate EUR 157.04 first instalment (regional tax EUR 140 + stamp EUR 16 + insurance EUR 1.04) is always due and is NOT included in the amount. The year (2026/27) is stated in the page intro, outside the quoted table, to keep the quote contiguous."
