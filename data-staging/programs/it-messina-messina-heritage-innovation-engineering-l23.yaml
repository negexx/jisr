  notes: "Two academic years of calls are given on the Application and Admission page; the intake shown is the first round (1st Call - 'Early Bird') for non-EU visa applicants of A.Y. 2027/2028, and further rounds exist (2nd: 2 Feb–19 Mar 2027; 3rd: 8 Apr–8 May 2027). Tuition: the pages state a yearly fee by country group, but no quote ties Morocco to the group names used by the programme itself (degree-class/department), so no group-specific figure for this programme could be quoted; the figure quoted is the 'fixed rate ... due during the enrolment process' of € 156.00 (Group A regional tax only) because no accepted quote ties the programme to a group, and the other accepted quote names the enroling country-group amount (€ 256,00 for the Morocco group). Application channel: the pages say non-EU students enrolling in degree programmes apply for the entry visa on the Universitaly portal, but no accepted quote explicitly states the pre-enrolment (preiscrizione) application on Universitaly for this programme, so applicationChannel was left out; the pre-evaluation application itself is made on the UniME Application Portal.; UniME fee by country group, Morocco named in Group B on the fees page itself (and in the UniME List of Countries PDF 2026-04). The page headline figure for Group B is EUR 256, which the page itself splits as EUR 100 + regional tax; tuition proper (university contribution) proposed as EUR 100 per the project rule that the regional tax is not tuition. The student pays 256 in total. Year: page says the country-group system applies effective from 2025/26 (no later change published); the list PDF is dated 2026-04. Owner may prefer 256 (page's own 'yearly tuition fee' label)."
