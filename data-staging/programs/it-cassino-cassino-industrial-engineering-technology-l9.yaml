  notes: "OWNER CONFIRMED on 2026-10-08, reading the regulation PDF (DR 482/2026, art. 3.3): Morocco is in country group A (600 EUR per year, annual all-inclusive contribution by citizenship, any course of study); the extracted text of the table is garbled, so the quotes alone do not show the tie. Cassino 2026/27 tuition regulation (DR 482 of 02/07/2026), art. 3.3: annual all-inclusive contribution (Contributo omnicomprensivo annuale) by country group of citizenship, applies to any course of study. Group A = 600 EUR; Morocco is in the group A country list (PDF text layer merges the table: Morocco sits in the A block that ends at Zimbabwe, group B starts at Albania; audit visually). Regional tax 140 EUR and stamp 16 EUR are extra and not included. Programme not tied to a group because the fee does not depend on programme. Year 2026/27; 2027/28 not published."
