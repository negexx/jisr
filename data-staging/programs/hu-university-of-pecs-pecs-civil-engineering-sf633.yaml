      quote: "Submit the following documents: - Passport sized photo - Copy of the photo-page(s) of your passport - High School Diploma - Transcript of Records - Medical Certificate - Curriculum Vitae in English - Motivation Letter - Portfolio - Recommendation letters, more documentation etc. – optional submission"
