  notes: Read by code from the Parcoursup fiche (French level, distance learning) and from Campus France national pages (duration, fees for a non-EU student at a public institution, certificate, platform). The national facts are not this programme's own page. | La formation est entièrement à distance et les enseignements s'étalent d'octobre à mai (au lieu de deux semestres). Les droits d'inscription différenciés de 2 902 €/an pour la Licence sont indiqués par la page Campus France Maroc pour les étudiants extra-communautaires ; des exonérations sont possibles selon l'établissement. Le B2 en français est le niveau requis par cette formation et une certification (TCF, DELF B2 ou DALF) est obligatoire pour la procédure Études en France, sauf en cas de dispense (les candidats en L1 n'en sont pas dispensés). La modalité DAP/Études en France s'applique aux candidats marocains titulaires d'un bac marocain. Les stages en présentiel pour les travaux pratiques peuvent nécessiter un visa.
