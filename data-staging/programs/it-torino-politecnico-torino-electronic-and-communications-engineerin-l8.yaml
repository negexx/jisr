      url: https://www.polito.it/sites/default/files/2026-07/Regolamento%20L%20imma%2025_26%20%2B%20LM_LS.pdf
      quote: Allegato 2 – Importi della contribuzione per studenti con cittadinanza extra- UE il cui nucleo familiare ha redditi e patrimoni all’estero (art. 2)
  notes: "Politecnico di Torino a.y. 2026/27 (Rector's Decree 701/2026, regulation for students enrolled from 2025/26): the yearly all-inclusive contribution (contributo onnicomprensivo annuale) of a non-EU student whose household has income abroad is set per citizenship country in Allegato 2; Morocco row = 761 EUR (also the fixed amount for countries not listed). Same amount for every programme (not tied to degree area). Art. 2 says it is bounded between Tmin 600 and Tmax 3,600 EUR and is computed from the country's PPP GDP. ISEE-based reductions may exist but are not applied. The a.y. 2025/26 regulation also shows MAROCCO 761."
