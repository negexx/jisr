  notes: "Read by code from the Parcoursup fiche (French level, distance learning) and from Campus France national pages (duration, fees for a non-EU student at a public institution, certificate, platform). The national facts are not this programme's own page. | Tuition left out: no programme-specific fee for non-EU students can be quoted for this programme. The Parcoursup page shows a general 178 euros/year figure, but the programme page is the Parcoursup page for French/European Bac holders, and the differentiated non-EU fee is only described institution-wide (univ-amu.fr page giving general differentiated-fee policy, amounts stated on the Campus France Maroc page as 2 902 euros for a Licence year). Language proficiency: the page gives only a required French level (B2) without naming tests; the certificate requirement is set by Campus France separately. Subject expectations are described in general terms (scientific skills, mathematics notes) rather than as a precise subject list; DAP deadlines shown (15 December 2024 etc.) are for the 2025 campaign."
