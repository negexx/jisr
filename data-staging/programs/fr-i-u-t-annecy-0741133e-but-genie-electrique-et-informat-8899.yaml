  notes: "Read by code from the Parcoursup fiche (French level, distance learning) and from Campus France national pages (duration, fees for a non-EU student at a public institution, certificate, platform). The national facts are not this programme's own page. | The tuition facts contradict each other, so no tuition amount is stated: the Parcoursup fiche for this programme lists \"Par année 178 euros.\" and \"Par année pour les étudiants boursiers Pas de frais pour les boursiers.\" for scholarship holders only, and the Campus France/USMB pages state differentiated fees of 2 902 € for Licence and 2 895 € from 2026, but these general and news figures are not clearly stated for this programme. The \"B2\" French requirement is taken from the Parcoursup fiche for this BUT and is written there as a required level, but the same fiche describes \"maîtrise du français\" as an assessed criterion rather than a certificate requirement. The intakes quote comes from the ADIUT Maroc programme page for first-year BUT applications by Études en France; it is specific to Maroc. Programme page is the IUT Annecy GEII page, even though the Parcoursup fiche and the ADIUT page also describe the same BUT."
