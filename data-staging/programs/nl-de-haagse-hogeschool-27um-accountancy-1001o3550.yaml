      url: https://www.dehaagsehogeschool.nl/opleidingen/hbo-bachelor/accountancy-voltijd
      quote: Met een buitenlands of internationaal diploma kun je toegelaten worden, mits dit diploma toelating biedt tot hbo en je een bewijs hebt van voldoende beheersing van de Nederlandse taal.
    - fact: requirements.req-1
      url: https://www.dehaagsehogeschool.nl/studiekeuze/alles-over-aanmelden-en-inschrijven/toelatingseisen
      quote: Je toont aan dat je voldoet aan de taaleis Nederlands via een staatsexamen Nederlands als Tweede Taal, programma II met alle vier de onderdelen lezen, spreken, schrijven en luisteren.
    - fact: requirements.req-2
      url: https://www.dehaagsehogeschool.nl/studiekeuze/alles-over-aanmelden-en-inschrijven/toelatingseisen
      quote: De Centrale Studenten Inschrijving bepaalt of jouw buitenlandse diploma ten minste gelijkwaardig is aan dat van een (toelatinggevend) Nederlands diploma. Schrijf je daarvoor in via Studielink.
    - fact: requirements.req-2
      url: https://www.dehaagsehogeschool.nl/studiekeuze/alles-over-aanmelden-en-inschrijven/contact-en-veelgestelde-vragen-faqs
      quote: Om erachter te komen of je toelaatbaar bent dien je een inschrijfverzoek in via Studielink. Vervolgens ontvang je van ons een e-mail met het verzoek om je documenten te uploaden in Osiris Aanmelding. De Centrale Studenten Inschrijving zal je documenten beoordelen en kijken of je met je buitenlandse diploma toelaatbaar bent.
    - fact: requirements.req-3
      url: https://www.dehaagsehogeschool.nl/studiekeuze/alles-over-aanmelden-en-inschrijven/toelatingseisen
