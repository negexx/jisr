      source: page-2
      info_kind: official
      kind: manual_check
      note:
        fr:
          text: "Les candidats qui obtiennent moins de 50% à la section Mathématiques du test TOLC-I reçoivent une obligation formative additionnelle (OFA) : acquérir au moins 9 CFU en MAT/05."
          status: draft
        en:
          text: "Candidates who score less than 50% in the Mathematics section of the TOLC-I test receive an Additional Formative Obligation (OFA): to acquire at least 9 CFU in the MAT/05 subject area."
          status: draft
