    - fact: tuition
      url: https://www.unifi.it/sites/default/files/2026-06/manifesto_studi_26_27.pdf
      quote: Se sei residente all’estero ottieni l’attribuzione automatica di un ISEE universitario figurativo, calcolato per gruppi di nazioni sulla base della classificazione annuale del reddito delle nazioni fatta dalla World Bank; per l’a.a. 2026/2027 si tiene conto della classificazione pubblicata nell’anno 2026
  notes: "Università di Firenze a.y. 2026/27 Manifesto degli Studi: students resident abroad get an automatic figurative ISEE by World Bank income group of their country (sect. 14.2); Allegato 5 lists Morocco in REDDITO MEDIO-BASSO (figurative ISEE 36,500) with the first-year contribution I rata 625.80 + II rata 313.20 = total annual 939. Cross-check: Allegato 1 (first-year, full-time) row for ISEE 36,000.01-37,000 gives total 939.00. This is the contributo onnicomprensivo only; the stamp duty (16) and regional tax (140) are separate (sect. 13) and not included. The same table applies to all degree programmes (no programme-group tie needed)."
