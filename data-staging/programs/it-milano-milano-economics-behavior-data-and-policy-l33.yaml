  notes: "intakes: kept the existing official value; the reader found [{\"startDate\":null,\"applicationOpens\":\"2026-03-12\",\"applicationDeadline\":\"2026-07-06\"}] at https://apps.unimi.it/files/bandi/bando-2027-1-economics-behavior-data-and-policy-(classe-l-33-r).pdf?24-APR-26=; Tuition left out: the pages give only ISEE-based instalments or country-group amounts; no accepted quote names Morocco in the country list of the regulation, so no country-group figure could be tied to this applicant. The university also states a 'Diversified tuition fees according to the student's home country for international students with assets/income abroad' but the country list was not found. Application windows: the piece 'Application from 12 March to 6 July 2026' is a general deadline; the same Call indicates non-EU candidates applying for visa are placed in a separate ranking with the same rules and that they must submit a pre-enrolment application on Universitaly by 31 July 2026 (a visa pre-enrolment deadline, therefore not written as applicationDeadline). More rounds may exist. Documents: the Call (Art. 10, foreign qualification, apply.unimi.it) lists 8 items; the Universitaly pre-enrolment document list also requires a passport picture and a B2 language certificate or MOI certificate and an identity document. English OFA: the B2 level is required to sit exams; the certificate can be replaced by a secondary school diploma with English as teaching language or a SLAM placement test.; Unimi regulation 2026/27 art. 6: international students with household income abroad (no ISEE) pay a fixed second instalment by country group (Annex 2) and tuition area (Annex 1). Morocco (MAROCCO) closes the Group A list in Annex 2 (two-column PDF layout, last item before the 'Gruppo B' heading; audit visually). Group A: 200 EUR (area A) or 256 EUR (area B). The amount quote does not name the programme's area, so the range is given; Annex 1 of the same regulation lists 'Economics: behavior, data and policy, Laurea triennale' under AREA B (Scienze politiche, economiche e sociali), so the actual figure is probably 256 EUR (second quote limit prevented adding that tie). First instalment 146 EUR (regional tax 130 for group A + 16 stamp) is not tuition and is excluded. Year 2026/27 (applies to new enrolments from 2026/27); 2027/28 not published. The amount quote is from the unimi fees page (HTML, same figures as the regulation art. 6 table)."
