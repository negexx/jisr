  notes: "Tuition: no figure given. The reduced fixed fee page states amounts by country group (e.g. € 1,000 + €157.04 for non-OECD freshmen) and the Morocco name appears in the non-OECD list PDF, but that same page also requires that the family has income and/or assets only outside Italy and that the student's citizenship be in a listed country; the quote stating the amount and the quote naming Morocco are on different pages, and the amount quote does not tie this programme's group, so no reliable single figure or range for this applicant could be quoted with consistent evidence. Under rule 2, the Morocco tie quote would have been the country-list PDF. Application window: the quote stating the dates (\"First selection: 10 February 2026 to 4 May 2026, 1:00pm\") does not explicitly say the dates are reserved for non-EU applicants resident abroad; the only nearby non-EU reference is the reserved places quote, so the deadline may apply to all applicants. The pages also mention a second selection (5 May 2026 to 3 July 2026) and an extraordinary selection (3 September 2026 to 11 September 2026); several rounds exist, first round used.; Reduced fixed fee (flat tax) of the University of Bologna for citizens of non-OECD countries, a.y. 2026/27 (the page says 'fixed amounts for the a.y. 2026/27'): first-cycle freshman EUR 1,000 per year (EUR 1,200 without the minimum credits, not applicable to a freshman). Morocco (Marocco) is on the 'Elenco Paesi NON OCSE' 2026 list and is NOT on the particularly-poor list (that list was checked, EUR 500 tier does not apply). Requirements: citizenship of a listed country and family income/assets only outside Italy (declaration only). The separate EUR 157.04 first instalment (regional tax EUR 140 + stamp EUR 16 + insurance EUR 1.04) is always due and is NOT included in the amount. The year (2026/27) is stated in the page intro, outside the quoted table, to keep the quote contiguous."
