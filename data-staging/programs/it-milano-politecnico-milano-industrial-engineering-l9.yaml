  notes: "Tuition: non-EU applicants with a foreign household are charged based on the ISEEU parificato, which needs a CAF (with income/assets documentation legalised and translated into Italian). The pages provide no single figure for this programme; the only stated amounts are the €880.04 first instalment and confirmatory-second-instalment range of €0–€3,003 for a general Laurea 2026/27 student, not a figure for a non-EU applicant with a household abroad. No programme-group (area A/B) or country-group fee is stated in the supplied pages, and no accepted quote names Morocco as belonging to a fee group. Tuition is therefore left out. Dates: the pages state that 2026/27 admissions for non-EU candidates ran in multiple phases (first phase early enrolment 4 May – 11 June 2026, later phases via rankings) but no date is quoted as being for non-EU applicants living abroad, so no intake was recorded. The Universitaly visa deadline (31 August 2026) and the Italian Government visa formalisation deadline (30 November 2026) are visa deadlines, not application deadlines."
