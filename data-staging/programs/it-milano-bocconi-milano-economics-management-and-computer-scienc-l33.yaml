  notes: "La page officielle du programme (management-and-computer-science) ne correspond pas exactement au nom du programme indiqué dans la tâche (Economics, Management and Computer Science), mais il s'agit du même programme de licence en informatique de gestion à Bocconi. Les frais de scolarité sont donnés pour tous les programmes de licence (Bachelor of Science) de Bocconi : 17 700 € par an pour la première année, sans distinction de nationalité. Les échéances d'admission indiquées concernent les candidats internationaux ; il existe également une session Winter avec une date limite en janvier 2027. Aucune information sur les frais pour les étudiants non-UE résidant à l'étranger n'a été trouvée ; le montant indiqué s'applique à tous les étudiants de première année de licence. Les documents listés proviennent de la page des admissions générales et de la page des diplômes."
