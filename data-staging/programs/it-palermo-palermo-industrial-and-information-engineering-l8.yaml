  notes: "Licence de 3 ans (classe L-8 R et L-9 R), entièrement enseignée en anglais selon le manifeste des études de l'A.A. 2026/2027. Le calendrier d'admission trouvé concerne l'A.A. 2025/2026 pour la procédure des étudiants extra-UE résidant à l'étranger : fenêtre 15 avril 2026 – 20 juillet 2026 (une seule manche indiquée sur la page). Frais de scolarité : laissés hors du JSON car aucune citation n'indique le montant pour ce programme ; la page des frais indique des montants fixes selon le pays (List B2A : 211 €, List B2B : 267 €, autres : 378 €), mais aucune citation ne relie le Maroc à une liste pour l'A.A. 2026/27 (la seule liste de pays trouvée — Tabella B2, avec le Maroc en List B — correspond à un autre A.A. et n'est pas acceptée ici). Procédure : préinscription sur le portail Universitaly puis inscription sur le portail des étudiants UniPa ; deux tutoriels existent (Bachelor et Master)."
