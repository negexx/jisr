    - fact: tuition
      url: https://www.unisi.it/sites/default/files/allegatiparagrafo/Regolamento_contribuzione_2026-2027.pdf
      quote: importo del contributo onnicomprensivo annuale dovuto è stabilito in misura pari ai valori corrispondenti al range “9X” della precedente Tab. A moltiplicati per uno dei seguenti coefficienti (Tab. C), quando assumono valori minori di uno. I coefficienti sono calcolati confrontando il prodotto interno lordo (PIL) pro-capite adeguato alle parità dei poteri di acquisto (PPA) del Paese di cittadinanza con quello relativo all’Italia, utilizzando come base le rilevazioni pubblicate dal Fondo Monetario Internazionale (FMI). L’importo del contributo dovuto non può essere comunque inferiore a euro 500,00.
    - fact: tuition
      url: https://www.unisi.it/sites/default/files/allegatiparagrafo/Regolamento_contribuzione_2026-2027.pdf
      quote: Marocco 4.762,729 0,1103
  notes: "Deux sélections existent pour les candidats non-UE résidant à l'étranger (NC1 et NC2) ; la première (NC1, deadline 30/04/2026) est indiquée. Les frais de scolarité n'ont pas pu être extraits : le règlement des frais (Regolamento contribuzione 2026/2027) prévoit une réduction par pays de citoyenneté mais la table ne nomme pas le Maroc avec un montant précis pour ce programme, et aucune citation ne lie le programme à un groupe de frais spécifique. Le programme exige un entretien en ligne pour les candidats non-UE. Un certificat de langue anglaise peut être remplacé par un entretien d'évaluation de langue.; Siena 2026/27 contribution regulation, Art. 4: for students who cannot produce a valid Italian ISEE (no ISEE parificato allowed; this is the regime of foreign-income students) the all-inclusive annual contribution is the '9X' row of Tab. A multiplied by the Tab. C coefficient of the country of citizenship, with a floor of EUR 500. Tab. C lists Marocco with coefficient 0,1103 (a number below one), and every 9X value in Tab. A (2.250 to 2.952) times 0,1103 is far below 500, so the EUR 500 floor applies whatever the course type or group; I did not compute a product for the proposal, 500 is the stated floor. Regional tax (DSU) and stamp duty are added to the first instalment and are not included. Inference to audit: the regulation does not name 'foreign students' in comma 6 itself, it follows comma 5 (no ISEE parificato for those who cannot produce the Italian ISEE) and uses citizenship coefficients. The unisi simulator (https://parch.unisi.it/servizi2/simulatoretasse/?anno=2026) would confirm the figure. Programme is technical-scientific type, irrelevant here because of the floor. Biotech Engineering for Health is restricted access with a visa quota; fee proposal does not imply a place is open to visa applicants."
