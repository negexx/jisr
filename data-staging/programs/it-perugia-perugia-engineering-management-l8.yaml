  notes: "Tuition: no figure could be stated. The only published amount is the fixed Flat Tax per country group (€400–€1,000 depending on bracket), which is for students whose family income/assets are abroad; although Morocco is listed in CLASSE 3: MEDIUM HUMAN DEVELOPMENT, that list is from an older academic year (fascia flat 23/24 amounts) whereas the current Flat Tax page is for A.Y. 2026/27, so no amount quote from the same academic year as the list can be tied to Morocco. The income-based option is only described without stating a lowest and highest fee for this student, and the general sentence 'Students may expect to pay a yearly tuition usually between 150 and 2200 Euros' depends on family income and merit and is not a stated fee for this programme. Deadlines: for the FREE ACCESS BACHELOR'S DEGREE IN ENGINEERING MANAGEMENT the PICA pre-enrolment period is open until 12:00 am on August 21, 2026; after that, enrolment proceeds on the Universitaly portal for the study visa. A second PICA procedure for non-EU students legally residing in Italy opens on July 1, 2026 and does not apply to this applicant. programmePage: the Italian page https://ing.unipg.it/didattica/corsi-di-studio/engineering-management/engineering-management-l8-l9 is the same programme's own page."
