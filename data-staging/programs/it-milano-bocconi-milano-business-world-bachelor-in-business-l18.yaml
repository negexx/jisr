  notes: "Aucun tarif de scolarité publié pour ce programme : la page des frais indique « For 2027-28 a.y., for students enrolled to their first year in a Bachelor of Science or Law programme, tuition and fees at Bocconi are set at € 17,700 per year. » mais renvoie explicitement aux pages du WBB pour ce programme (« for the WBB (World Bachelor in Business) you can find more information here »), donc ce montant général n'est pas retenu pour le WBB. Aucune page ne donne de frais spécifiques au WBB ni de groupe par nationalité incluant le Maroc. Le canal de candidature est le portail Common Application de USC (aucune mention d'Universitaly). Les deux tours ED/EA partagent la même date limite (1er novembre 2026) ; d'autres tours existent selon le site USC."
