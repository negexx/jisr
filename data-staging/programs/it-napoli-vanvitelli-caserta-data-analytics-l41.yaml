      quote: "È OBBLIGATORIO effettuare upload (caricamento in procedura) della seguente documentazione: • documento di identità in corso di validità (upload obbligatario e bloccante); • codice fiscale (upload obbligatorio e bloccante); • foto formato tessera"
  notes: "Frais de scolarité : aucune quote ne relie ce programme (ou sa classe/département) à un groupe de frais pour un étudiant non-UE avec foyer au Maroc. La page Manifesto Tasse 2026/27 distingue des « Scientific Area 2 » mais elle liste des classes de diplôme dans l'en-tête sans montrer le libellé de la classe ; de plus il s'agit d'un tableau de tranches ISEE (nombreuses lignes), ce que la règle interdit comme tuition. Les pages ne nomment pas le Maroc dans une liste de pays, donc la règle du groupe-pays ne s'applique pas. Le bando mentionne pour le paiement (en l'absence d'ISEE) « € 202,00 per gli studenti stranieri che appartengono a paesi in via di sviluppo » mais aucune quote acceptée ne relie le Maroc à cette catégorie : laissé de côté. Les frais restent donc à vérifier manuellement. Plusieurs tours d'admission existent pour le même candidat non-UE (bando d'avril 2026 avec échéance du 3 juillet 2026, puis ré-émission avec échéance du 21 septembre 2026) : le premier tour indiqué ici est celui du bando ré-émis 2026/27. Langue d'enseignement : le programme est intégralement en anglais."
