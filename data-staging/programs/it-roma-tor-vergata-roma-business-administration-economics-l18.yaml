  name: Business Administration & Economics
  institution: Università degli studi di Roma Tor Vergata
  city: Roma
  field: business-economics
  confidence: high
  officialUrl: ""
  todo: "MUR lists: degree class L-18 Scienze dell'economia e della gestione aziendale (also listed under L-33), language Inglese, mode Convenzionale, access locale, town Roma; offer of academic year 2025/26 (the next year's offer is not published: check it on the programme page); the MUR file has no programme page: find the programme's own page on the university's site (officialUrl is required), then duration, language, tuition for a non-EU student living abroad, intakes, documents, requirements and the application channel (Universitaly pre-enrolment, plus the university's own portal where it says so); locale access: limited places, an admission test or ranking applies: read how it works for non-EU applicants; prepared by the assistant from the quoted pages (see evidence): included in the audit sample draw"
  sourceId: mur:05802:l18:business-administration-economics@roma
  preparedBy: assistant
  preparedAt: 2026-10-05
  evidence:
    - fact: applicationChannel
      url: https://www-2023.studenti.uniroma2.it/en/preiscrizione-e-visto-dingresso/
      quote: If you are a non-EU citizen residing abroad, you must submit a pre-enrolment application to request an entry visa for study purposes in order to enter Italy.
    - fact: applicationChannel
      url: https://www-2023.studenti.uniroma2.it/en/preiscrizione-e-visto-dingresso/
      quote: You must submit the pre-enrolment application on the Universitaly platform (www.universitaly.it)
    - fact: documents
      url: https://web.uniroma2.it/en/percorso/admissions
      quote: "Mandatory documents to be uploaded during pre-enrollment procedures on Universitaly: Passport Photo Admission letter (if provided) High-school diploma (for enrollment in Bachelor's Degree programmes) / Bachelor's Degree + Transcript of exams (for enrollment in Master's Degree programmes)"
    - fact: documents
      url: https://web.uniroma2.it/en/percorso/admissions
      quote: Final high-school diploma in original. High-school report cards.
    - fact: documents
      url: https://web.uniroma2.it/en/percorso/admissions
      quote: Translations must always be made in compliance with the rules established by the Ministry of Foreign Affairs and International Cooperation (MAECI)
    - fact: requirements.req-1
      url: https://web.uniroma2.it/en/percorso/admissions
      quote: The qualification must be obtained at the end of a school period equal to at least 12 years of schooling
    - fact: requirements.req-2
      url: https://web.uniroma2.it/contenuto/come_iscriversi_con_titolo_estero
      quote: Per i corsi di studio erogati in lingua italiana, i candidati in possesso di un titolo di studio estero devono seguire le modalità indicate nel bando o nell'avviso di ammissione del corso di studi prescelto.
    - fact: requirements.req-3
      url: https://web.uniroma2.it/contenuto/come_iscriversi_con_titolo_estero
      quote: Per i corsi di studio dove è prevista l'iscrizione al test di ammissione o valutazione puoi consultare tutte le informazioni sulle procedure e le scadenze sui relativi bandi o avvisi
    - fact: requirements.req-4
      url: https://web.uniroma2.it/en/percorso/admissions
      quote: The deadline to submit UniversItaly pre-enrollment is July 31 except for programs that require entrance exam, in that case the pre-enrollment must be submitted before the test.
  notes: "Tuition left out: the pages only give an ISEE-band table and a fee simulator, not one amount for a full-time non-EU applicant living abroad (https://www-2023.studenti.uniroma2.it/it_it/simulatore-calcolo-tasse-e-contributi/ and the 2021/22 thesis-mobility band's ISEE table). The programme's own page (economia.uniroma2.it) is a 2018 Dual Degree news item and states no duration, language, tuition, intake or document list for this Bachelor. No language proficiency rule for an entrance requirement was found; only a general admission-language statement (Italian B2) tied to Italian-taught degrees. Deadline rule for Universitaly (July 31) is stated for the general non-EU pre-enrolment route; the pre-enrolment route is a visa step, not an application to this programme."
