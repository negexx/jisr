      quote: "- from January 10th, 2026 to March 19th, 2026 (FIRST selection round);"
    - fact: intakes
      url: https://economia.uniroma2.it/public/ba/files/BANDO_BAE_2026-27/ENG_Call_for_Applications_Bando_CdL_BUSINESS_ADMINISTRATION_AND_ECONOMICS___a.a.2026-2027_PUBBLICATO.pdf
      quote: International students residing abroad and applying for a visa, under penalty of exclusion and automatic cancellation of the application, may apply exclusively for the first selection round
    - fact: tuition
      url: https://www-2023.studenti.uniroma2.it/wp-content/uploads/2026/07/Guida-dello-Studente-2026_2027v5.pdf
      quote: Indipendentemente dal Paese di provenienza, il contributo onnicomprensivo annuo fisso pari a € 2.500,00, anche se in possesso della borsa di studio Lazio DiSCo, per i Corsi di laurea Triennale e Magistrale in lingua inglese "M.Sc. Business Administration", "M.Sc. Finance and Banking", "B.Sc. Business Administration and Economics"
    - fact: tuition
      url: https://www-2023.studenti.uniroma2.it/wp-content/uploads/2026/07/Guida-dello-Studente-2026_2027v5.pdf
      quote: "per gli studenti internazionali o italiani con redditi all’estero, per i quali risulti inapplicabile il calcolo dell'ISEE ai sensi dell'art. 8 comma 5 del DPCM 159/2013, oltre la tassa regionale e l’imposta di bollo, sono tenuti a corrispondere:"
  notes: "Tuition: no figure found for a non-EU student with a household outside Italy. The pages give only generic 'Tuition Fees' links or ISEE-based instalments (which need the Italian ISEE, an income proxy a student in Morocco does not have) and no country-group list naming Morocco, so tuition is left out. Intakes: the first selection round (10 Jan – 19 Mar 2026) is the only one open to non-EU applicants residing abroad and requiring a visa; a second round (April–June 2026) and a third (extraordinary) round exist but are reserved for EU students and non-EU students legally residing in Italy. Application channel: for a non-EU applicant residing abroad, pre-enrolment goes through the Universitaly platform (mandatory for the visa); the University's own Delphi portal is used for the selection application (CEnT-S + oral interview), and the Call art. 5 says the Delphi application must be validated. The deadline quote's selection-round text and the residency restriction quote come from the same 2026/27 Call for Applications.; Tor Vergata Student Guide 2026/27 (file name and 10/08/2026 dates), chapter 7, section C (matricole from 2020/2021 on): international students or Italians with income abroad, for whom the ISEE cannot be computed, pay a fixed all-inclusive annual contribution of EUR 2,500 REGARDLESS of country of origin for the English-taught course 'B.Sc. Business Administration and Economics' (named in the quote), in addition to regional tax and stamp duty (so those are not included). No Morocco tie is needed because the figure does not depend on the country. Applies to a student whose household income is abroad."
