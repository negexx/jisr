  notes: "Tuition left out: the pages give no single EUR amount for a full-time Bachelor student from outside the EU living abroad; the fee pages are ISEE-band simulators and international-student fee pages that state no amount. Intakes left out: no application deadline for non-EU applicants with a year is stated on the supplied pages for this programme. Documents quote is from the admissions page and refers to non-EU applicants requiring a visa. Morocco is not a signatory to the Lisbon Convention, which affects which qualification-recognition documents apply (CIMEA statements), but the pages do not name those as applicant-submitted documents in a quotable single-amount way; flag for human review."
