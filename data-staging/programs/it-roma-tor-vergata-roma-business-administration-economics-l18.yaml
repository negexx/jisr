      quote: You must submit the pre-enrolment application on the Universitaly platform (www.universitaly.it) and then contact the Italian embassy in your country, which will issue you with the entry visa to enter Italy for study purposes and fall within the places reserved for non-EU citizens.
    - fact: applicationChannel
      url: https://web.uniroma2.it/en/percorso/admissions
      quote: The pre-enrollment application on Universitaly is mandatory for all non-EU applicants not residing in Italy (including those holding a residence permit for other EU countries).
    - fact: documents
      url: https://web.uniroma2.it/en/percorso/admissions
      quote: "Mandatory documents to be uploaded during pre-enrollment procedures on Universitaly: Passport Photo Admission letter (if provided) High-school diploma (for enrollment in Bachelor's Degree programmes) / Bachelor's Degree + Transcript of exams (for enrollment in Master's Degree programmes)"
    - fact: requirements.req-1
      url: https://web.uniroma2.it/en/percorso/admissions
      quote: The qualification must be obtained at the end of a school period equal to at least 12 years of schooling and allow access at the universities of the country where the qualification was obtained
    - fact: requirements.req-2
