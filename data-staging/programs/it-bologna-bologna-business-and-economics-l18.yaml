      quote: Reduced fixed fee for nationals of non-OECD countries Requirements Enrolled on a first- or single-cycle degree programme Enrolled in second-cycle programmes If you are a freshman or have the minimum number of credits € 1,000 + €157.04 € 1,200 + €157.04
    - fact: tuition
      url: https://www.unibo.it/en/attachments/nonOECDcountries.pdf/@@download/file/non-OECD-countries.pdf
      quote: Macedonia del Nord Malaysia Maldive Marocco Maurizio Moldova
  notes: "Tuition: no tuition figure for a non-EU applicant from Morocco could be set. The pages state income-based fees (ISEE) or a reduced flat fee for citizens of non-OECD countries (list) and of particularly poor/developing countries (list of DM n. 176 of 24/02/2026). The non-OECD list PDF indeed names Marocco, but the fees page gives a table with several figures depending on programme cycle and credits, and no single quote states both a lowest and a highest fee for this programme; only a full ISEE band table is given, so tuition is left out. Application window: no quote for non-EU applicants residing abroad states a dated opening/closing window with a year for a.y. 2026/27 or 2027/28; the first/second/extraordinary selection windows (10 February 2026 to 4 May 2026, etc.) are not tied to non-EU applicants residing abroad. Tuition/visa figures found (e.g. first instalment €157.04, €20 application fee, health coverage €700) are not a tuition for this student.; Reduced fixed fee (flat tax) of the University of Bologna for citizens of non-OECD countries, a.y. 2026/27 (the page says 'fixed amounts for the a.y. 2026/27'): first-cycle freshman EUR 1,000 per year (EUR 1,200 without the minimum credits, not applicable to a freshman). Morocco (Marocco) is on the 'Elenco Paesi NON OCSE' 2026 list and is NOT on the particularly-poor list (that list was checked, EUR 500 tier does not apply). Requirements: citizenship of a listed country and family income/assets only outside Italy (declaration only). The separate EUR 157.04 first instalment (regional tax EUR 140 + stamp EUR 16 + insurance EUR 1.04) is always due and is NOT included in the amount. The year (2026/27) is stated in the page intro, outside the quoted table, to keep the quote contiguous."
