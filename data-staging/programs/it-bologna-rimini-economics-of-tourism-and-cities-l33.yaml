      quote: Macedonia del Nord Malaysia Maldive Marocco Maurizio Moldova
  notes: "Tuition: no programme-specific fee quote exists. A reduced fixed fee (flat tax) applies to citizens of particularly poor and developing countries (a list that names Marocco) and of non-OECD countries; the figure used is the first / single-cycle figure from the 2026/27 reduced-fee page ('€500 + €157.04' for freshmen, to '€600 + €157.04' without the minimum credits), excluding the €157.04 first instalment (regional tax + stamp duty + insurance), which is not tuition. The programme itself is not tied to a group by any quote, so the group tie quote is not given. Programme duration, teaching language and application deadlines are not stated on the supplied pages: the dates in the how-to-enrol page (e.g. 26 May 2026) are enrolment deadlines after selection, not application deadlines for the 2026/27 call, and the call itself is not supplied. Additional learning requirements (OFA) and any further intakes/runners-up procedures are not selected here.; Reduced fixed fee (flat tax) of the University of Bologna for citizens of non-OECD countries, a.y. 2026/27 (the page says 'fixed amounts for the a.y. 2026/27'): first-cycle freshman EUR 1,000 per year (EUR 1,200 without the minimum credits, not applicable to a freshman). Morocco (Marocco) is on the 'Elenco Paesi NON OCSE' 2026 list and is NOT on the particularly-poor list (that list was checked, EUR 500 tier does not apply). Requirements: citizenship of a listed country and family income/assets only outside Italy (declaration only). The separate EUR 157.04 first instalment (regional tax EUR 140 + stamp EUR 16 + insurance EUR 1.04) is always due and is NOT included in the amount. The year (2026/27) is stated in the page intro, outside the quoted table, to keep the quote contiguous."
