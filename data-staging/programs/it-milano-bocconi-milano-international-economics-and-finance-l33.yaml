      quote: For 2027-28 a.y., for students enrolled to their first year in a Bachelor of Science or Law programme, tuition and fees at Bocconi are set at € 17,700 per year.
  notes: Bocconi single first-year amount for every BSc student (no nationality or country-group rule on the fees page), a.y. 2027-28. The amount is 'tuition and fees' (the page says the 1st instalment includes regional tax, stamp duties, administrative and registration fee), so it is all-inclusive, not the bare contribution. Partial waivers 20-80% exist (need/merit based) and are not applied. The held programme URL now shows the page titled 'Finance' (BSc, 3 yrs, English); the rename of International Economics and Finance to Finance is an inference, owner to confirm.
