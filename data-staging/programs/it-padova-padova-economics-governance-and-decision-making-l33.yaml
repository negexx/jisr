  notes: "Tuition: the programme belongs to Gruppo A (Humanities), which includes the School of Economics and Political Science, so the fixed all-inclusive fee for non-EU citizens not resident in Italy is EUR 2,790/year (academic year 2026/27); this fee can be waived only in part (regional tax reduction via ISEE parificato) and the amount is not recalculated. This is a fixed fee, not an income-based range. Intakes: the non-EU call for AY 2027/28 runs 7 January 2027 – 7 March 2027; a second call for EU and EU-equated students (9 March – 9 April 2027) exists but does not apply to this applicant. applicationChannel: the university tells applicants to apply on apply.unipd.it; the pages do not state that non-EU applicants residing abroad must pre-enrol on Universitaly, so 'it-university-direct' was used.; Padova fixed non-recalculable contribution (contributo onnicomprensivo) for non-EU citizens with non-Italian household, enrolled from 2023/24, rules for 2026/27 (bando contribuzione 2026/27 Table 4 and unipd.it/contribuzione-studentesca): group A 2,790 EUR, group B 2,990 EUR. Group not tied to the programme by any quote, so the range of the two fixed figures is given. The programme belongs to the Department of Economics and Management (probably group A, Scuola di Economia e Scienze Politiche = 2,790), but no quote ties it to a group. The 'Paesi particolarmente poveri' reduced figure (930 / 996.66) is not used: Morocco is not in the DM 176/2026 list (MUR PDF), and the page cites DM 166/2025 instead (conflict between pages on which decree applies; neither list names Morocco as far as read). Regional tax and stamp (about 208 EUR) are extra and not included. CONFLICT: the programme factsheet on apply.unipd.it (intake 2027/28) shows 'Tuition fee EUR 2,950 per year' (waivable via ISEE) which matches neither 2,790 nor 2,990; 2027/28 rules were not found, so the 2026/27 rule is used."
