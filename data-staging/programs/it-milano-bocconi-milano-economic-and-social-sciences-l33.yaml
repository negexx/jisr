  notes: The BSc in Economics programme page does not explicitly list teaching languages beyond 'The program is offered entirely in English.' The tuition fee of €17,700 per year applies to first-year Bachelor of Science or Law students at Bocconi for 2027-28, but the page does not state that this amount is specifically for non-EU students; it appears to be a general fee for all first-year Bachelor of Science or Law students. However, it is the only figure provided for this programme and academic year. The application channel is not specified in the pages; the applicant should check the Apply2B portal and possibly the Universitaly portal for pre-enrolment.
