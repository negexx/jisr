summary:
  fr:
    text: Bourse régionale gérée par ER.GO pour les étudiants des universités d'Émilie-Romagne. Les étudiants internationaux de pays hors UE ayant des revenus à l'étranger fournissent des documents de leur pays pour calculer un équivalent de l'ISEE.
    status: draft
  en:
    text: Regional scholarship managed by ER.GO for students at universities in Emilia-Romagna. International students from non-EU countries with income abroad submit home-country documents, used to calculate an equivalent of the ISEE.
    status: draft
