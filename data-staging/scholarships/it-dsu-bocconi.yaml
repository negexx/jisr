summary:
  fr:
    text: Bourse régionale pour le droit aux études, gérée par l'Université Bocconi pour ses propres étudiants. Les étudiants non-UE dont la famille vit à l'étranger passent par un ISEEU parificato délivré par le CAF partenaire de Bocconi.
    status: draft
  en:
    text: Regional right-to-study scholarship managed by Bocconi University for its own students. Non-EU students whose family lives abroad use an ISEEU parificato certificate issued by the CAF partnered with Bocconi.
    status: draft
