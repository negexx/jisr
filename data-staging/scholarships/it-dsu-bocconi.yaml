howToApply:
  fr:
    text: Obtenir l'ISEEU parificato auprès du CAF partenaire de Bocconi, puis déposer la demande en ligne via le lien publié sur la page de l'université pendant la période de candidature, avec les documents justificatifs.
    status: draft
