summary:
  fr:
    text: "Bourse du gouvernement français (AEFE et ministère de l'Europe et des Affaires étrangères) pour les meilleurs bacheliers non français d'un lycée français à l'étranger : cinq ans d'études supérieures en France, premier cycle (prépa, licence) compris. Montants (allocation mensuelle selon la situation familiale, voyage, logement) sur la page officielle."
    status: draft
  en:
    text: "French government scholarship (AEFE and the Ministry for Europe and Foreign Affairs) for the best non-French leavers of a French school abroad: five years of higher education in France, including the first cycle (preparatory classes, licence). Amounts (a monthly allowance depending on family circumstances, travel, housing) are on the official page."
    status: draft
