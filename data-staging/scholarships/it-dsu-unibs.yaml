howToApply:
  fr:
    text: Demande en ligne sur le site de l'Université (Domanda servizi online), à confirmer avant la date limite de l'appel. Les étudiants hors d'Italie demandent l'ISEE parificato à un CAAF conventionné, avec des documents du pays des revenus traduits en italien.
    status: draft
  en:
    text: Apply online through the University website (Domanda servizi online) and confirm before the call's deadline. Students with income outside Italy request the ISEE parificato from an affiliated CAAF, using documents from the country of income translated into Italian.
    status: draft
