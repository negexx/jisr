summary:
  fr:
    text: Bourse pour le droit aux études gérée directement par l'Université de Brescia pour ses étudiants. Les étudiants étrangers dont les revenus sont à l'étranger demandent un ISEE équivalent (ISEE parificato) à un CAAF conventionné avec l'Université.
    status: draft
  en:
    text: Right-to-study scholarship managed directly by the University of Brescia for its own students. Foreign students with income abroad request an equivalent ISEE (ISEE parificato) from a CAAF affiliated with the University.
    status: draft
