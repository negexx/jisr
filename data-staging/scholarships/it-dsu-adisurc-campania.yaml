howToApply:
  fr:
    text: Demande uniquement en ligne sur le site d'ADiSURC, zone réservée aux étudiants ; les étudiants de nationalité étrangère y accèdent avec les identifiants obtenus lors de l'accréditation. Fournir l'ISEEUP, puis, sur demande, les documents traduits.
    status: draft
  en:
    text: Apply online only on the ADiSURC website, in the students' reserved area; students of foreign nationality log in with credentials obtained at accreditation. Send the ISEEUP and, if requested, translated documents.
    status: draft
