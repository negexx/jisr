  fr:
    text: Bourse pour le droit aux études gérée par EDiSU Pavia pour les étudiants de l'Université de Pavie. Pour les étudiants étrangers dont la famille vit à l'étranger, la situation économique est calculée par un ISEE équivalent (ISEE parificato) à partir de documents du pays des revenus.
