summary:
  fr:
    text: Bourse régionale pour le droit aux études, gérée directement par l'Université de Padoue pour ses étudiants. Les étudiants internationaux dont la famille vit à l'étranger obtiennent un ISEE équivalent (ISEE parificato) auprès du CAF conventionné.
    status: draft
  en:
    text: Regional right-to-study scholarship managed directly by the University of Padua for its own students. International students whose families live abroad obtain an equivalent ISEE (ISEE parificato) from the CAF affiliated with the University.
