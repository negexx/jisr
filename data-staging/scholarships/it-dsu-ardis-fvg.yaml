summary:
  fr:
    text: Bourse régionale gérée par ARDIS pour les étudiants des universités du Frioul-Vénétie julienne. Les étudiants non européens dont la famille vit à l'étranger obtiennent un ISEE universitaire équivalent (ISEE parificato) auprès d'un CAF conventionné.
    status: draft
  en:
    text: Regional scholarship managed by ARDIS for students at universities in Friuli Venezia Giulia. Non-EU students whose families live abroad obtain an equivalent university ISEE (ISEE parificato) from a CAF under agreement (CAF convenzionato).
    status: draft
