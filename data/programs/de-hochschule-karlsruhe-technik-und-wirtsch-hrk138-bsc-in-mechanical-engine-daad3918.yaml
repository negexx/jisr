        en:
          text: Check whether your secondary school certificate (Moroccan Baccalauréat) is recognised for studies in Germany via the DAAD database on admission requirements; a Pre-Semester or eligibility examination may be required.
          status: draft
        ar:
          text: تحقق مما إذا كانت شهادة نهاية دراستك الثانوية (البكالوريا المغربية) معترفًا بها للدراسة في ألمانيا عبر قاعدة بيانات DAAD حول شروط القبول؛ وقد يُطلب تحضير (Pre-Semester) أو امتحان أهلية.
          status: draft
    - id: req-3
      source: page-2
      info_kind: official
      kind: manual_check
      note:
        fr:
          text: "Un des tests standardisés suivants est exigé : SAT (au moins 1200 points), ACT (au moins 24 points) ou TestAS (rang centile de 75). Vérifiez les scores requis et les codes d'établissement."
          status: draft
        en:
          text: "One of the following standardised tests is required: SAT (at least 1200 points), ACT (at least 24 points) or TestAS (percentile rank of 75). Check the required scores and school codes."
          status: draft
        ar:
          text: "يُشترط أحد الاختبارات الموحّدة التالية: SAT (1200 نقطة على الأقل) أو ACT (24 نقطة على الأقل) أو TestAS (رتبة مئوية 75). تحقق من النتائج المطلوبة ورموز المؤسسات."
          status: draft
    - id: req-4
      source: page-2
      info_kind: official
      kind: manual_check
      note:
        fr:
          text: Une lettre de motivation est obligatoire ; elle doit être rédigée en anglais sur le formulaire officiel et répondre à plusieurs questions.
          status: draft
        en:
          text: A motivation letter is required; it must be written in English using the official form and answer several questions.
          status: draft
        ar:
          text: الرسالة التحفيزية إلزامية؛ ويجب كتابتها بالإنجليزية على الاستمارة الرسمية والإجابة عن عدة أسئلة.
          status: draft
    - id: req-5
      source: page-2
      info_kind: official
      kind: manual_check
      note:
