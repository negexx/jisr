        fr:
          text: Vérifiez si votre diplôme de fin d'études secondaires (baccalauréat marocain) est reconnu pour des études en Allemagne via la base de données DAAD sur les conditions d'admission ; une préparation (Pre-Semester) ou un examen d'éligibilité peut être exigé.
