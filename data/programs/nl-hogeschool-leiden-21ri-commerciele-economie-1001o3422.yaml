          text: For admission without a havo/vwo/mbo 4 diploma (Toelatingsonderzoek 21+), the test for Commerciële Economie is due by 23 June 2026 (report to be submitted); the fee in 2025 is around € 342 and a positive result does not guarantee admission, as the examination committee decides.
