        fr:
          text: Pour l'admission sans diplôme havo/vwo/mbo 4 (Toelatingsonderzoek 21+), l'épreuve pour Commerciële Economie a lieu au plus tard le 23 juin 2026 (rapport à fournir) ; les frais en 2025 sont d'environ € 342 et le résultat ne garantit pas l'admission, la commission d'examen décidant.
          status: draft
