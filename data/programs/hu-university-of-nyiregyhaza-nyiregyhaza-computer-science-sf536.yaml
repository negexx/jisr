        fr:
          text: Un entretien oral en ligne (Microsoft Teams) est obligatoire pour vérifier l'anglais, l'orientation professionnelle et la motivation. L'examen est réussi avec au moins 60 points sur 100. Sans le paiement de 100 EUR de frais de dossier, aucun examen n'est possible.
