        en:
          text: An online oral interview (Microsoft Teams) is mandatory to check English skills, professional orientation and motivation. The exam is passed with at least 60 of 100 points. Without paying the 100 EUR application fee, no entrance exam is possible.
          status: draft
        ar:
          text: مقابلة شفوية عبر الإنترنت (Microsoft Teams) إلزامية للتحقق من الإنجليزية والتوجه المهني والدافع. يُعتبر الامتحان ناجحًا بالحصول على 60 نقطة على الأقل من 100. ولا يمكن اجتياز أي امتحان دون أداء 100 EUR من رسوم الملف.
          status: draft
    - id: req-2
