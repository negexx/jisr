      info_kind: official
      kind: manual_check
      note:
        fr:
          text: De bons résultats en mathématiques sont attendus (High school / secondary education (or higher). Good results in Mathematics.), sans seuil chiffré précisé.
          status: draft
        en:
          text: Good results in mathematics are expected (High school / secondary education (or higher). Good results in Mathematics.), with no precise numerical threshold stated.
          status: draft
