          text: If your foreign school-leaving certificate is not comparable to the Abitur, direct admission is only possible after the Studienkolleg and the assessment exam (Feststellungsprüfung).
          status: draft
        ar:
          text: إذا كانت شهادتكم الأجنبية غير قابلة للمقارنة بالـ Abitur، فلا يمكن القبول المباشر إلا بعد Studienkolleg واجتياز امتحان التقييم (Feststellungsprüfung).
          status: draft
