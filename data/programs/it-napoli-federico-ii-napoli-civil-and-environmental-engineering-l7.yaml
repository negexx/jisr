      kind: manual_check
      note:
        fr:
          text: Test d'admission sélectif obligatoire (CISIA English TOLC-I), à passer à distance après inscription sur le site CISIA. Un minimum de 20% du score maximal est exigé.
          status: draft
        en:
          text: Compulsory selective admission test (CISIA English TOLC-I), to be taken remotely after registering on the CISIA website. A minimum threshold of 20% of the maximum score is required.
          status: draft
    - id: req-3
      source: page-2
      info_kind: official
      kind: manual_check
      note:
        fr:
          text: "Les candidats qui obtiennent moins de 50% à la section Mathématiques du test TOLC-I reçoivent une obligation formative additionnelle (OFA) : acquérir au moins 9 CFU en MAT/05."
          status: draft
        en:
          text: "Candidates who score less than 50% in the Mathematics section of the TOLC-I test receive an Additional Formative Obligation (OFA): to acquire at least 9 CFU in the MAT/05 subject area."
          status: draft
    - id: req-4
      source: page-2
      info_kind: official
      kind: manual_check
      note:
        fr:
          text: "Procédure de pré-admission obligatoire pour les étudiants non-UE nécessitant un visa : sélection de mi-février à mi-juin via la page d'admission ou par e-mail, puis lettre de pré-admission."
          status: draft
        en:
          text: "Compulsory pre-admission procedure for non-EU students requiring a visa: selection from mid-February to mid-June via the intake webpage or by email, then a pre-admission letter."
          status: draft
    - id: req-5
      source: page-2
      info_kind: official
      kind: manual_check
      note:
        fr:
          text: Le candidat doit fournir une garantie financière de 6.080,00 €/an pendant trois ans et souscrire une assurance maladie/santé pour le visa d'études.
          status: draft
        en:
          text: The candidate must provide a financial guarantee of €6,080.00/year for three years and take out health insurance for the study visa.
          status: draft
