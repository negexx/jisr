summary:
  fr:
    text: "UNEDasiss (UNED) évalue les dossiers des étudiants internationaux et délivre l'Acreditación, un certificat numérique permettant de participer aux procédures d'admission à l'université espagnole, incluant les notes des PCE. Pour les systèmes hors UE, au moins quatre matières sont recommandées ; l'accréditation n'est pas acceptée par toutes les universités."
    status: draft
  en:
    text: "UNEDasiss (UNED) evaluates international students' academic records and issues the Acreditación, a digital certificate allowing participation in Spanish university admission processes and including the PCE grades. For non-EU systems, at least four subjects are recommended; the accreditation is not accepted by all universities."
    status: draft
  ar:
    text: "تقيّم UNEDasiss (جامعة UNED) ملفات الطلبة الدوليين وتمنح شهادة Acreditación، وهي شهادة رقمية تتيح المشاركة في مساطر القبول بالجامعات الإسبانية وتشمل علامات اختبارات PCE. وبالنسبة للأنظمة خارج الاتحاد الأوروبي يُوصى بتقديم أربع مواد على الأقل؛ ولا تقبل جميع الجامعات هذا الاعتماد."
    status: draft
