summary:
  fr:
    text: "L'Espagne n'a pas de portail national : la demande d'admission se fait auprès de l'université de destination, dans le cadre du système de préinscription de sa région. La région et l'université fixent les dates et décident de l'admission."
    status: draft
  en:
    text: "Spain has no national portal: the admission application is made at the destination university, through the pre-enrolment system of its region. The region and the university set the dates and decide on admission."
    status: draft
  ar:
    text: "لا توجد في إسبانيا بوابة وطنية: يُقدَّم طلب القبول لدى الجامعة المستقبِلة ضمن نظام التسجيل المسبق الخاص بجهتها. وتحدّد الجهة والجامعة المواعيد وتقرّران القبول."
