summary:
  fr:
    text: Bourse régionale gérée par ADISU Puglia pour les étudiants des universités des Pouilles. L'appel est ouvert aux étudiants italiens et étrangers ; ceux dont la famille a des revenus à l'étranger fournissent des documents de leur pays.
    status: draft
  en:
    text: Regional scholarship managed by ADISU Puglia for students at universities in Puglia. The call is open to Italian and foreign students; those whose families have income abroad submit documents from their home country.
    status: draft
  ar:
    text: منحة جهوية تديرها ADISU Puglia لطلبة جامعات بوليا. وإعلان المنحة مفتوح للطلبة الإيطاليين والأجانب؛ ويقدّم من لأسرهم دخل في الخارج وثائق من بلدهم.
