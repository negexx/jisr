summary:
  fr:
    text: "Bourse du gouvernement hongrois pour les études de licence complètes : frais de scolarité pris en charge, allocation mensuelle et contribution au logement (montants sur la page officielle). Le Maroc est pays partenaire pour la licence en informatique, ingénierie et économie ; la candidature se fait sur la plateforme du programme et auprès de l'autorité marocaine responsable."
    status: draft
  en:
    text: "Hungarian government scholarship for full-degree Bachelor studies: tuition covered, a monthly stipend and an accommodation contribution (amounts on the official page). Morocco is a sending partner for Bachelor studies in computer science, engineering and economics; you apply on the programme platform and to the responsible Moroccan authority."
    status: draft
  ar:
    text: "منحة الحكومة المجرية لدراسة الإجازة كاملة: تُغطى الرسوم الدراسية، مع مخصص شهري ومساهمة في السكن (المبالغ في الصفحة الرسمية). المغرب بلد شريك في الإجازة في المعلوميات والهندسة والاقتصاد؛ ويكون التقديم عبر منصة البرنامج ولدى السلطة المغربية المسؤولة."
    status: draft
