howToApply:
  fr:
    text: L'élève de terminale est présélectionné par le proviseur du lycée français à l'étranger, puis saisit son dossier sur l'application dédiée ; l'AEFE et l'ambassade de France examinent la candidature (voir la page de l'AEFE pour la campagne de l'année).
    status: draft
  en:
    text: The terminale student is shortlisted by the head of the French school abroad, then submits the application on the dedicated platform; the AEFE and the French embassy review it (see the AEFE page for the year's campaign).
    status: draft
  ar:
    text: يُرشّح مدير الثانوية الفرنسية بالخارج طالب السنة النهائية ضمن قائمة أولية، ثم يُدخل ملفه عبر المنصة المخصصة؛ وتدرس AEFE وسفارة فرنسا الطلب (انظر صفحة AEFE لحملة السنة).
    status: draft
