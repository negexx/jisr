summary:
  fr:
    text: Bourse régionale d'aide aux études gérée par l'ADiSU pour les étudiants inscrits dans les universités de l'Ombrie. Les étudiants étrangers complètent la demande avec les documents sur les revenus et les biens à l'étranger.
    status: draft
  en:
    text: Regional right-to-study grant managed by ADiSU for students enrolled at universities in Umbria. Foreign students complete the application with documents on income and assets held abroad.
    status: draft
  ar:
    text: منحة جهوية لدعم الدراسة تديرها ADiSU لفائدة الطلبة المسجلين في جامعات أومبريا. ويستكمل الطلبة الأجانب الطلب بوثائق عن الدخل والممتلكات في الخارج.
    status: draft
