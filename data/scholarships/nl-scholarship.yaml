summary:
  fr:
    text: "Bourse nationale neerlandaise (ex-Holland Scholarship), financee par le ministere de l'Education et les etablissements participants : 5 000 EUR verses la premiere annee d'etudes, en licence. Reservee aux etudiants venant de hors de l'EEE admis dans un etablissement participant ; ce n'est pas une bourse qui couvre la totalite des frais de scolarite."
    status: draft
  en:
    text: "Dutch national scholarship (formerly the Holland Scholarship), funded by the Ministry of Education and the participating institutions: EUR 5,000 paid in the first year of Bachelor studies. For students from outside the EEA admitted to a participating institution; it does not cover full tuition."
    status: draft
  ar:
    text: "منحة هولندية وطنية (كانت تُعرف سابقاً بمنحة هولندا)، تموّلها وزارة التعليم والمؤسسات المشاركة: 5 000 EUR تُدفع في السنة الأولى من الإجازة. مخصّصة للطلبة القادمين من خارج المنطقة الاقتصادية الأوروبية المقبولين في مؤسسة مشاركة؛ ولا تغطي كامل الرسوم الدراسية."
    status: draft
