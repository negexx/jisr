  fr:
    text: Bourse régionale gérée par DSU Toscana pour les étudiants des universités de Florence, Pise et Sienne. Les étudiants hors UE dont la famille vit ou a des revenus à l'étranger fournissent des documents traduits en italien et légalisés.
    status: draft
  en:
    text: Regional scholarship managed by DSU Toscana for students at the universities of Florence, Pisa and Siena. Non-EU students whose family lives or has income abroad submit documents translated into Italian and legalised.
    status: draft
  ar:
    text: منحة جهوية تديرها DSU Toscana لطلبة جامعات فلورنسا وبيزا وسيينا. ويقدّم الطلبة من خارج الاتحاد الأوروبي (UE) الذين تعيش أسرهم أو لها دخل في الخارج وثائق مترجمة إلى الإيطالية ومصادقًا عليها.
