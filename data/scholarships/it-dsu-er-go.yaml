howToApply:
  fr:
    text: Candidature en ligne sur le site d'ER.GO, chaque année. Les documents de revenus étrangers, traduits et légalisés, sont à téléverser dans le Dossier Utente avant les dates limites de l'appel.
    status: draft
  en:
    text: Apply online through the ER.GO website every academic year. Foreign income documents, translated and legalised, are uploaded in the Dossier Utente by the deadlines set in the call.
    status: draft
  ar:
    text: التقديم عبر الإنترنت على موقع ER.GO كل سنة. تُرفع وثائق الدخل الأجنبية، مترجمة ومصادَقًا عليها، في Dossier Utente قبل المواعيد النهائية للنداء.
