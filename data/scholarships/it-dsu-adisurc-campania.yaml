summary:
  fr:
    text: Bourse régionale gérée par ADiSURC pour les étudiants des universités de Campanie. Les étudiants étrangers dont la famille réside à l'étranger sont évalués par un ISEE parificato (ISEEUP) établi auprès d'un CAF.
    status: draft
  en:
    text: Regional scholarship managed by ADiSURC for students at universities in Campania. Foreign students whose households live abroad are assessed through an equivalent ISEE (ISEEUP, ISEE parificato) prepared at a CAF.
    status: draft
