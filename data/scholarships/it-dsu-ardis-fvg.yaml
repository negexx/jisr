howToApply:
  fr:
    text: Demande en ligne sur le site d'ARDIS, chaque année. Les étudiants non européens ne résidant pas en Italie avec seulement un document d'identité étranger s'identifient selon une procédure distincte prévue par l'appel.
    status: draft
  en:
    text: Apply online through the ARDIS website every academic year. Non-EU students not resident in Italy who hold only a foreign identity document identify themselves through a separate procedure set out in the call.
    status: draft
  ar:
    text: الطلب عبر الإنترنت على موقع ARDIS كل سنة. أما الطلبة غير الأوروبيين غير المقيمين في إيطاليا والذين لا يملكون سوى وثيقة هوية أجنبية، فيتم التحقق من هويتهم وفق إجراء منفصل ينص عليه إعلان المنحة.
