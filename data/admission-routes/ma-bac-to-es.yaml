slug: ma-bac-to-es
origin: MA
credentialType: ma-bac
destination: ES
level: bachelor
outcome: check
conditions:
  - id: homologacion-mandatory
    kind: manual_check
    source: homologacion
    info_kind: official
    note:
      fr:
        text: "Votre baccalauréat marocain doit d'abord être homologué en Título de Bachiller espagnol par le ministère de l'Éducation : c'est la procédure d'homologation des diplômes étrangers de fin d'études secondaires."
        status: draft
      en:
        text: "Your Moroccan baccalauréat must first be homologated as the Spanish Título de Bachiller by the Ministry of Education: this is the procedure for homologating foreign secondary-school diplomas."
        status: draft
      ar:
        text: "يجب أولًا معادلة الباكالوريا المغربية بشهادة Título de Bachiller الإسبانية لدى وزارة التربية: وهو إجراء معادلة شهادات نهاية التعليم الثانوي الأجنبية."
        status: draft
  - id: unedasiss-credencial-and-pce
    kind: manual_check
    source: unedasiss
    info_kind: official
    note:
      fr:
        text: "La voie d'accès passe par une Acreditación UNEDasiss avec une Calificación de Acceso, obtenue grâce aux PCE (Pruebas de Competencias Específicas) : au moins 4 matières. UNEDasiss évalue le dossier mais ne réalise pas l'homologation du diplôme."
        status: draft
      en:
        text: "The access route goes through an Acreditación UNEDasiss with a Calificación de Acceso, obtained through the PCE (Pruebas de Competencias Específicas): at least 4 subjects. UNEDasiss assesses the record but does not carry out the homologación of the diploma."
        status: draft
      ar:
        text: "يمرّ مسار الولوج عبر اعتماد UNEDasiss مع Calificación de Acceso يُحصل عليه عبر اختبارات PCE: أربع مواد على الأقل. وتقيّم UNEDasiss الملف لكنها لا تتولّى معادلة الشهادة."
        status: draft
  - id: nota-de-corte
    kind: manual_check
    source: admission
    info_kind: official
    note:
      fr:
        text: "L'admission suit la note d'admission de chaque formation, dans la limite de ses places : la note du dernier candidat admis (nota de corte) varie chaque année et selon l'université, et il n'existe pas de liste nationale."
        status: draft
      en:
        text: "Admission follows each programme's admission mark, within its number of places: the mark of the last applicant admitted (nota de corte) varies every year and by university, and no national list exists."
        status: draft
      ar:
        text: "يتم القبول حسب علامة القبول لكل تكوين في حدود مقاعده: وتتغيّر علامة آخر مترشح قُبل (nota de corte) كل سنة ومن جامعة إلى أخرى، ولا توجد قائمة وطنية."
        status: draft
  - id: visa-proof-of-funds
    kind: manual_check
    source: visa
    info_kind: official
    note:
      fr:
        text: "Le visa d'études exige de prouver des moyens d'existence d'au moins 100 % de l'IPREM par mois, comme le fixe la réglementation sur l'immigration."
        status: draft
      en:
        text: "The study visa requires proof of means of at least 100% of the IPREM per month, as set by the immigration regulation."
        status: draft
      ar:
        text: "تتطلب تأشيرة الدراسة إثبات موارد معيشية لا تقل عن 100% من IPREM شهريًا، وفق ما يحدّده نظام الهجرة."
        status: draft
note:
  fr:
    text: "Un baccalauréat marocain ne donne pas d'accès direct à une licence espagnole : l'homologation, l'accréditation UNEDasiss et la nota de corte s'appliquent, et chaque région et université décide. C'est la règle générale, pas une décision d'admission propre à un pays."
    status: draft
  en:
    text: "A Moroccan baccalauréat does not give direct access to a Spanish Bachelor's degree: homologación, the UNEDasiss accreditation and the nota de corte apply, and each region and university decides. This is the general rule, not an admission decision specific to one country."
    status: draft
  ar:
    text: "لا تمنح الباكالوريا المغربية ولوجًا مباشرًا إلى الإجازة الإسبانية: تُطبَّق المعادلة واعتماد UNEDasiss وnota de corte، وتقرّر كل جهة وجامعة. وهذه قاعدة عامة لا قرار قبول خاص ببلد معيّن."
    status: draft
