slug: ma-bac-to-it
origin: MA
credentialType: ma-bac
destination: IT
level: bachelor
outcome: check
conditions:
  - id: twelve-years-of-schooling
    kind: manual_check
    source: annex1
    info_kind: official
    note:
      fr:
        text: "Un titre étranger ouvre l'accès à la licence s'il vient d'au moins 12 ans de scolarité et donne accès à un cursus analogue dans le pays d'origine ; pour les titres hors UE, la réussite des deux dernières années est un élément important. Chaque université évalue le titre : rien n'indique comment le baccalauréat marocain est jugé, demandez-le à l'université."
        status: draft
      en:
        text: "A foreign title gives access to a Bachelor's degree if it comes from at least 12 years of schooling and gives access to a similar course in the country that issued it; for non-EU titles, passing the last two years is a key element. Each university assesses the title: nothing says how the Moroccan baccalauréat is judged, ask the university."
        status: draft
      ar:
        text: "تتيح الشهادة الأجنبية الولوج إلى الإجازة إذا صدرت بعد 12 سنة دراسية على الأقل وكانت تفتح الولوج إلى تكوين مماثل في بلد إصدارها؛ وبالنسبة لشهادات خارج الاتحاد الأوروبي فإن النجاح في السنتين الأخيرتين عنصر أساسي. وتقيّم كل جامعة الشهادة: لا يوضح المصدر كيف تُقيَّم الباكالوريا المغربية، اسألوا الجامعة."
        status: draft
  - id: universitaly-preenrolment-and-visa
    kind: manual_check
    source: circular
    info_kind: official
    note:
      fr:
        text: "Préinscription uniquement sur Universitaly ; l'université valide dans la limite de ses places pour étudiants internationaux (+ 20 %), et seuls les dossiers validés peuvent demander le visa. Visa : au plus tard le 30 novembre 2026 (2026/2027) et le 31 octobre 2027 (2027/2028) ; l'université peut fixer une date plus proche pour chaque formation."
        status: draft
      en:
        text: "Pre-enrolment is made only on the Universitaly portal; the university validates it within a cap set from its places for international students (those places plus 20%), and only validated applications can apply for the visa. Visa application: by 30 November 2026 for 2026/2027 and by 31 October 2027 for 2027/2028; the university may set an earlier date for each programme."
        status: draft
      ar:
        text: "يتم التسجيل المسبق حصريًا عبر بوابة Universitaly؛ وتصادق عليه الجامعة في حدود سقف يحدَّد انطلاقًا من مقاعدها المخصصة للطلبة الدوليين (زائد 20%)، ولا يمكن طلب التأشيرة إلا بعد المصادقة. طلب التأشيرة: في أجل أقصاه 30 نونبر 2026 للموسم 2026/2027 و31 أكتوبر 2027 للموسم 2027/2028؛ ويمكن للجامعة تحديد تاريخ أسبق لكل شعبة."
        status: draft
  - id: language-proof
    kind: manual_check
    source: circular
    info_kind: official
    note:
      fr:
        text: "Pour une formation en italien, l'université organise un test d'italien d'au moins B2 avant la demande de visa (sauf dispense, par exemple avec un certificat B2) ; pour une formation dans une autre langue, il faut un certificat adéquat de la langue d'enseignement."
        status: draft
      en:
        text: "For a course taught in Italian, the university runs an Italian test of at least B2 before the visa application (unless exempt, for example with a B2 certificate); for a course taught in another language, a suitable certificate of the language of instruction is needed."
        status: draft
      ar:
        text: "بالنسبة لتكوين بالإيطالية تنظم الجامعة اختبارًا في الإيطالية بمستوى B2 على الأقل قبل طلب التأشيرة (إلا في حالة الإعفاء، مثلًا بشهادة B2)؛ وبالنسبة لتكوين بلغة أخرى يلزم تقديم شهادة مناسبة في لغة التدريس."
        status: draft
note:
  fr:
    text: "Le ministère italien décrit des règles générales pour les étudiants internationaux et non une décision par pays : chaque université évalue elle-même le titre et fixe ses dates. Ce n'est pas une décision d'admission."
    status: draft
  en:
    text: "The Italian ministry describes general rules for international students, not a decision per country: each university assesses the title itself and sets its own dates. This is not an admission decision."
    status: draft
  ar:
    text: "تصف الوزارة الإيطالية قواعد عامة للطلبة الدوليين لا قرارًا خاصًا بكل بلد: تقيّم كل جامعة الشهادة بنفسها وتحدد مواعيدها. وهذا ليس قرار قبول."
    status: draft
