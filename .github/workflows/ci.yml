name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck, lint, test, data, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # package.json engines requires Node >= 24.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (includes the src/domain import boundary)
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Validate reference data
        run: pnpm data:check

      # Runs data:check and data:build first, then next build.
      - name: Build
        run: pnpm build

      # Reports first-load JS per prerendered route and fails if a client chunk contains Zod markers.
      - name: Client JS size and Zod backstop
        run: pnpm perf:js

  # Browser specs against a production build of the synthetic fixture (journey, accessibility,
  # privacy, errors, JavaScript ratchet). `playwright test` builds and starts the app itself
  # (webServer in playwright.config.ts: pnpm build:e2e, then next start on port 3100).
  # SWC_NATIVE_BINDING_CACHE is a local Windows workaround and is deliberately not set here; whether
  # the build runs without it on ubuntu-latest is only known from a run of this job.
  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end specs
        run: pnpm test:e2e

      # The signed-in journey needs its own build with the accounts switch on; the switch and the test
      # secrets are set only in playwright.accounts.config.ts (ruling Q5), nothing is set here.
      - name: Run signed-in end-to-end specs
        run: pnpm test:e2e:accounts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-accounts/
          retention-days: 7
          if-no-files-found: ignore

      # Traces on failure, and on green runs the perf table and the accessibility findings
      # (test-results/perf.jsonl, test-results/a11y-findings.jsonl).
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: |
            test-results/
            test-results-accounts/
          retention-days: 7
          if-no-files-found: ignore

  # Race and transaction specs (tests/db-race/) need real concurrent connections, which the PGlite
  # harness cannot give. They run against a throwaway Postgres service container; each spec works in
  # its own `race_<random>` database. The password below is the container's throwaway one and guards
  # nothing. The guard step fails the job if the JSON report shows any skipped spec, so this job can
  # never pass by skipping (locally, without TEST_POSTGRES_URL, `pnpm test` skips them on purpose).
  db-race:
    name: Database race specs (Postgres service)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database race specs
        run: pnpm test:db-race --reporter=default --reporter=json --outputFile.json=db-race-report.json

      # The JSON reporter is minified: one `"status":"skipped"` per skipped test. At least one test
      # must have passed too, so an empty or missing report cannot slip through.
      - name: Fail if any race spec was skipped
        run: |
          if [ ! -s db-race-report.json ]; then
            echo "::error::db-race-report.json is missing or empty"
            exit 1
          fi
          if grep -Eq '"status":"(skipped|pending|todo|disabled)"' db-race-report.json; then
            echo "::error::A spec in tests/db-race/ was skipped; the db-race job must run every spec against the Postgres service"
            exit 1
          fi
          if ! grep -Eq '"numPassedTests":[1-9]' db-race-report.json; then
            echo "::error::No race spec passed"
            exit 1
          fi

  # Production deploy. Runs only on a push to main, only after verify and e2e passed. Vercel's own
  # Git deployments of main are disabled in vercel.json (git.deploymentEnabled), so this is the only
  # path to production. Vercel's Git integration still builds PR previews; they are protected by
  # Deployment Protection (Vercel Authentication), which also applies to *.vercel.app deployment
  # URLs, so the smoke step targets the public production domain from the repository variable
  # SMOKE_URL, never the deployment URL printed by `vercel deploy`.
  # Requires three repository secrets (never in code): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
  # The job is gated on the repository variable DEPLOY_ENABLED: the owner sets it to "true" after
  # adding the three secrets (docs/ops/deploy.md). Until then the job is skipped (grey, not red).
  # Once enabled, the secret pre-check below fails fast on purpose if a secret is missing, and
  # production is not updated.
  # The token is passed through the step environment (VERCEL_TOKEN), not as a --token argument, and
  # only to the steps that need it (the pre-check, `vercel pull` and `vercel deploy`).
  deploy:
    name: Deploy to Vercel (production)
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check deploy secrets are configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (see docs/ops/deploy.md)"
              exit 1
            fi
          done

      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Writes the Production-scoped variables (including NEXT_PUBLIC_SITE_URL) and project settings
      # under .vercel/, which `vercel build --prod` reads.
      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # No VERCEL_TOKEN here on purpose (least privilege): the build runs the install command and
      # `pnpm build`, whose child processes would inherit it, and everything it needs was written by
      # `vercel pull`. If this step ever fails with an auth error, give it VERCEL_TOKEN again and
      # record it in a new ADR.
      - name: Build
        run: vercel build --prod

      # stdout of `vercel deploy` is only the deployment URL. The assignment (not an echo around the
      # substitution) keeps a failed deploy from being swallowed.
      # --archive=tgz compresses the output into one file before upload. Vercel documents it for
      # deployments with thousands of files, "to minimize the number of files uploaded and avoid
      # hitting upload limits" (the Hobby API allows 5,000 uploads a day; this build output has about
      # 24,000 files). Documented with --prebuilt but not yet run in this repository (docs/ops/deploy.md).
      - name: Deploy prebuilt output
        run: |
          url="$(vercel deploy --prebuilt --archive=tgz --prod)"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Note that the smoke test is skipped
        if: ${{ vars.SMOKE_URL == '' }}
        run: echo "::notice::SMOKE_URL is not set; skipping the post-deploy smoke test"

      # The smoke tool runs with tsx, so it needs the project dependencies.
      - name: Install dependencies
        if: ${{ vars.SMOKE_URL != '' }}
        run: pnpm install --frozen-lockfile

      - name: Smoke test the public site
        if: ${{ vars.SMOKE_URL != '' }}
        run: pnpm ops:smoke "$SMOKE_URL" --expect=indexable
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
