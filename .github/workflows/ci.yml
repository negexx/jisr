name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck, lint, test, data, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # package.json engines requires Node >= 24.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (includes the src/domain import boundary)
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Validate reference data
        run: pnpm data:check

      # Runs data:check and data:build first, then next build.
      - name: Build
        run: pnpm build
